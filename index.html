<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Califeine</title>
<style>
:root{
  --vh:1vh;
  color-scheme:dark;
  --text:#f5f5f7; --dim:#8e8e95; --done:#b9b9c0; --line:#222225;
  --card:#131315; --card2:#1d1d20; --light:#f2f2f7;
  --pad:24px; --p:clamp(30px,calc(var(--vh)*4.8),40px);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:#000}
body{
  margin:0;height:100%;color:var(--text);overflow:hidden;
  font-family:ui-rounded,"SF Compact Rounded","SF Pro Rounded","SF Compact","Nunito","Varela Round",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:
    radial-gradient(66% 34% at 8% 16%,rgba(112,112,124,.38),transparent 72%),
    radial-gradient(60% 32% at 100% 50%,rgba(102,102,116,.32),transparent 72%),
    radial-gradient(76% 32% at 22% 100%,rgba(106,106,118,.34),transparent 72%),
    #000;
}
.app{position:relative;margin:0 auto;width:100%;max-width:430px;height:100%}
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding:calc(var(--vh)*11) var(--pad) calc(var(--vh)*6)}
.screen.on{display:flex;animation:in .35s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.head h1{margin:0;font-size:clamp(36px,10.6vw,44px);font-weight:800;letter-spacing:-.03em;line-height:1.05}
.head .sub{margin:12px 0 0;font-size:14px;font-weight:700;line-height:1.25}
.head .tag{margin:3px 0 0;font-size:14px;color:var(--dim);line-height:1.3}

.menu{margin-top:clamp(30px,calc(calc(var(--vh)*28.5) - 100px),170px);background:var(--card);border:0;border-radius:28px;overflow:hidden}
.row{display:flex;align-items:center;gap:16px;width:100%;height:clamp(58px,calc(var(--vh)*9.4),82px);padding:0 22px;background:none;border:0;color:var(--text);font:inherit;font-size:17px;font-weight:700;text-align:left;cursor:pointer;transition:background .15s}
.row+.row{border-top:1px solid var(--line)}
.row:active{background:var(--card2)}
.row .ico{width:24px;height:24px;flex:none;display:block}
.row .lbl{flex:1}
.row .chev{width:15px;height:15px;color:var(--dim);flex:none}

.fill{flex:1}
.go{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;height:clamp(58px,calc(var(--vh)*8),72px);border:0;border-radius:24px;background:var(--card);color:var(--text);font:inherit;font-size:17px;font-weight:700;cursor:pointer;transition:transform .12s,background .15s}
.go:active{transform:scale(.985);background:var(--card2)}
.go svg{width:20px;height:20px;flex:none}
.ver{text-align:center;margin:14px 0 0;font-size:13px;color:var(--dim)}

/* running */
.status{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:clamp(18px,calc(calc(var(--vh)*11) - 30px),90px);height:26px;font-size:16px;font-weight:700}
.status .tick{width:17px;height:17px}
.spin{display:inline-block;width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.22);border-top-color:#fff;animation:r .75s linear infinite;flex:none}
@keyframes r{to{transform:rotate(360deg)}}
.box{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;margin-top:calc(var(--vh)*2.4);background:var(--card);border-radius:28px;padding:12px 18px 6px}
.steps{margin:0;padding:0;list-style:none;flex:1 1 0;min-height:calc(var(--p)*2.5);display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;
  -webkit-mask-image:linear-gradient(transparent 0,#000 38%);mask-image:linear-gradient(transparent 0,#000 38%)}
.steps li{display:flex;align-items:center;gap:14px;height:var(--p);flex:none;padding-left:4px;font-size:14.5px;color:var(--done);font-weight:500;animation:up .3s ease both}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.steps li.now{color:#fff;font-weight:700}
.steps .ic{width:16px;height:16px;display:grid;place-items:center;flex:none}
.steps .tick{width:15px;height:15px}
.steps .hash{font-size:16px;font-weight:700;line-height:1;color:#fff}
.log{margin:8px 0 0;padding:12px 0 10px 4px;border-top:1px solid var(--line);height:122px;flex:none;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;
  font:11px/16px ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:#b2b2b9;white-space:nowrap}
.cancel{flex:none;align-self:stretch;margin:6px -18px 0;background:none;border:0;border-top:1px solid var(--line);color:#a8a8af;font:inherit;font-size:15px;font-weight:600;height:52px;cursor:pointer}
.cancel.done{color:#fff;font-weight:700}

/* sheets: floating, vertically centred like the real app */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.65);opacity:0;pointer-events:none;transition:opacity .28s;z-index:5}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:6;left:50%;top:48%;width:min(402px,calc(100% - 28px));
  background:var(--card);border:0;border-radius:30px;padding:20px;
  opacity:0;pointer-events:none;transform:translate(-50%,-44%) scale(.96);transition:transform .34s cubic-bezier(.2,.85,.25,1),opacity .24s}
.sheet.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.sh-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 0 14px;border-bottom:1px solid var(--line)}
.sh-top b{font-size:18px;font-weight:700}
.pill{border:0;background:var(--card2);color:#fff;font:inherit;font-size:14px;font-weight:700;padding:8px 14px;border-radius:8px;cursor:pointer;line-height:1}
.pill:active{opacity:.7}
.sheet p{margin:14px 0 0;font-size:14px;color:#d4d4d9;line-height:1.4}
.pms{display:flex;justify-content:center;gap:10px;margin:18px 0 14px}
.pm{background:none;border:0;padding:8px 8px 9px;border-radius:20px;color:var(--dim);font:inherit;font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;transition:background .15s,color .15s}
.pm .im{display:block;width:78px;height:78px;border-radius:19px;padding:0;border:0;overflow:hidden}
.pm img{display:block;width:100%;height:100%;object-fit:cover;pointer-events:none}
.pm.sel{color:#fff;background:var(--card2)}
.hint{text-align:center;margin:0 0 16px!important;font-size:12.5px!important;color:#c9c9cf!important}
.cont{display:block;width:100%;height:52px;border:0;border-radius:22px;background:var(--light);color:#6c6c72;font:inherit;font-size:16px;font-weight:600;cursor:pointer;transition:transform .12s,opacity .12s}
.cont:active{transform:scale(.985);opacity:.88}
.info{white-space:pre-line;font-size:14.5px!important;line-height:1.65!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

      <p class="sub">iOS 27 bd1 - 27.0.1 · iPhone</p>
      <p class="tag">Calif stands for stolen methods</p>

        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>

      <button class="row" data-info="credits">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"/><path d="M12 11v6M12 7.6v.01"/></svg>
        <span class="lbl">Credits</span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </nav>
    <div class="fill"></div>
    <button class="go" id="jb">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="11" width="15" height="10" rx="2.5"/><path d="M8 11V7.5a4 4 0 0 1 7.7-1.5"/></svg>
      Jailbreak
    </button>
    <p class="ver">Califeine 1.0</p>
  </section>

  <section class="screen" id="run">
    <header class="head">
      <h1>Califeine</h1>
      <p class="sub">iOS 27 bd1 - 27.0.1 · iPhone</p>
      <p class="tag">Calif stands for stolen methods</p>
    </header>
    <div class="status" id="status"></div>
    <div class="box">
      <ul class="steps" id="steps"></ul>
      <div class="log" id="log"></div>
      <button class="cancel" id="cancel">Cancel</button>
    </div>
  </section>

</main>

<div class="scrim" id="scrim"></div>

<div class="sheet" id="infoSheet" role="dialog" aria-label="Info">
  <div class="sh-top"><b id="infoTitle"></b><button class="pill" id="infoClose">Close</button></div>
  <p class="info" id="infoBody"></p>
</div>

<script>
(function(){
  function setVh(){
    var a=document.querySelector('.app'),H=(a&&a.clientHeight)||window.innerHeight;
    document.documentElement.style.setProperty('--vh',(H/100)+'px');
  }
  setVh();
  window.addEventListener('resize',setVh);
  window.addEventListener('orientationchange',setVh);
  if(window.ResizeObserver){try{new ResizeObserver(setVh).observe(document.querySelector('.app'))}catch(e){}}
})();
(function(){
  var $=function(id){return document.getElementById(id)};
  var STEPS=["Initializing…","Escaping Sandbox","Establishing Read / Write","Bypassing Kernel","Bypassing CodeTrust","Stealing Calif’s methods","Building TrustCache","Injecting TrustCache","Initializing Environment","Initializing Protection","Applying Bind Mounts","Finalizing Bootstrap","Loading Tweaks","Done"];
  var INFO={
    settings:{t:"Settings",b:"Package manager: Sileo\nRestore RootFS: off\nVerbose logging: on"},
    credits:{t:"Credits",b:"Califeine 1.0\nA fake jailbreak made for fun.\nNothing on your device is changed."}
  };
  var TICK='<svg class="tick" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3.2L13 5"/></svg>';
  var SPIN='<span class="hash">#</span>';
  var timer=null,pm="Sileo",running=false;

  function sheet(id,on){$(id).classList.toggle("on",on)}
  function scrim(){$("scrim").classList.toggle("on",$("pmSheet").classList.contains("on")||$("infoSheet").classList.contains("on"))}
  function closeSheets(){sheet("pmSheet",false);sheet("infoSheet",false);scrim()}
  function show(id){["home","run"].forEach(function(s){$(s).classList.toggle("on",s===id)})}

  $("jb").onclick=function(){sheet("pmSheet",true);scrim()};
  $("pmCancel").onclick=closeSheets;
  $("scrim").onclick=closeSheets;
  $("infoClose").onclick=closeSheets;
  document.querySelectorAll("[data-info]").forEach(function(b){
    b.onclick=function(){var d=INFO[b.dataset.info];$("infoTitle").textContent=d.t;$("infoBody").textContent=d.b;sheet("infoSheet",true);scrim()};
  });
  document.querySelectorAll(".pm").forEach(function(b){
    b.onclick=function(){document.querySelectorAll(".pm").forEach(function(x){x.classList.remove("sel")});b.classList.add("sel");pm=b.dataset.pm};
  });
  $("cont").onclick=function(){closeSheets();start()};

  function addLog(t){
    var l=$("log"),d=document.createElement("div");d.textContent="[*] "+t;l.appendChild(d);
    while(l.children.length>6)l.removeChild(l.firstChild);
  }
  function start(){
    show("run");running=true;
    $("steps").innerHTML="";$("log").innerHTML="";
    $("status").innerHTML='<span class="spin"></span><span>Jailbreaking</span>';
    $("cancel").textContent="Cancel";$("cancel").classList.remove("done");
    var i=0;
    (function next(){
      if(!running)return;
      var st=$("steps"),prev=st.querySelector(".now");
      if(prev){prev.classList.remove("now");prev.querySelector(".ic").innerHTML=TICK}
      if(i>=STEPS.length){finish();return}
      var last=i===STEPS.length-1,li=document.createElement("li");
      li.className="now";
      li.innerHTML='<span class="ic">'+(last?TICK:SPIN)+'</span><span>'+STEPS[i]+'</span>';
      st.appendChild(li);
      while(st.children.length>8)st.removeChild(st.firstChild);
      addLog(STEPS[i].replace("…","..."));
      i++;
      timer=setTimeout(next,i===STEPS.length?600:700+Math.random()*800);
    })();
  }
  function finish(){
    running=false;
    $("status").innerHTML=TICK+'<span>Jailbroken</span>';
    addLog(pm+" installed");
    $("cancel").textContent="Done";$("cancel").classList.add("done");
  }
  $("cancel").onclick=function(){clearTimeout(timer);running=false;show("home")};
  window.__fast=function(){clearTimeout(timer)}; // test hook
})();
</script>
